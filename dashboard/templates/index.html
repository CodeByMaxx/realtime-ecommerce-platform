<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Realtime E-Commerce Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .subtitle {
            color: #94a3b8;
            margin-top: 6px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
        }

        .dot.offline {
            background: #ef4444;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 22px;
        }

        .card-title {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 30px;
            font-weight: bold;
        }

        .card-subtitle {
            margin-top: 8px;
            font-size: 12px;
            color: #64748b;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .chart-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }

        .chart-card h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .chart-container {
            position: relative;
            height: 350px;
        }

        .error {
            display: none;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #450a0a;
            border: 1px solid #7f1d1d;
            color: #fecaca;
        }

        .info {
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .charts {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div>
            <h1>Realtime E-Commerce</h1>

            <div class="subtitle">
                Kafka → Spark Structured Streaming → Delta Lake → Redis
            </div>
        </div>

        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </header>


    <div class="error" id="errorBox"></div>


    <!-- =====================================================
         KPI CARDS
         ===================================================== -->

    <div class="cards">

        <div class="card">
            <div class="card-title">
                Revenue
            </div>

            <div class="card-value" id="revenue">
                €0.00
            </div>

            <div class="card-subtitle">
                Current window
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Orders
            </div>

            <div class="card-value" id="orders">
                0
            </div>

            <div class="card-subtitle">
                Purchases
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Events
            </div>

            <div class="card-value" id="events">
                0
            </div>

            <div class="card-subtitle">
                Total events
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Unique Users
            </div>

            <div class="card-value" id="uniqueUsers">
                0
            </div>

            <div class="card-subtitle">
                Active users
            </div>
        </div>

    </div>


    <!-- =====================================================
         CHARTS
         ===================================================== -->

    <div class="charts">

        <div class="chart-card">

            <h2>
                Revenue History
            </h2>

            <div class="chart-container">
                <canvas id="revenueChart"></canvas>
            </div>

        </div>


        <div class="chart-card">

            <h2>
                Orders & Events
            </h2>

            <div class="chart-container">
                <canvas id="ordersChart"></canvas>
            </div>

        </div>

    </div>


    <div class="info">
        Last update:
        <span id="lastUpdate">—</span>
    </div>

</div>


<script>

let revenueChart = null;
let ordersChart = null;


/* ============================================================
   FORMAT HELPERS
   ============================================================ */

function formatNumber(value) {

    const number = Number(value || 0);

    return number.toLocaleString("de-DE");
}


function formatCurrency(value) {

    const number = Number(value || 0);

    return number.toLocaleString("de-DE", {
        style: "currency",
        currency: "EUR"
    });
}


/* ============================================================
   STATUS
   ============================================================ */

function setOnline() {

    const dot = document.getElementById("statusDot");
    const text = document.getElementById("statusText");

    dot.classList.remove("offline");

    text.textContent = "Live";
}


function setOffline() {

    const dot = document.getElementById("statusDot");
    const text = document.getElementById("statusText");

    dot.classList.add("offline");

    text.textContent = "Offline";
}


/* ============================================================
   ERROR HANDLING
   ============================================================ */

function showError(message) {

    const box = document.getElementById("errorBox");

    box.textContent = message;

    box.style.display = "block";

    setOffline();
}


function clearError() {

    const box = document.getElementById("errorBox");

    box.style.display = "none";

    setOnline();
}


/* ============================================================
   CURRENT METRICS
   ============================================================ */

async function loadMetrics() {

    try {

        const response = await fetch(
            "/api/metrics",
            {
                method: "GET",
                cache: "no-store"
            }
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }


        const data = await response.json();


        console.log(
            "Current metrics:",
            data
        );


        /*
         * Update KPI cards
         */

        document.getElementById(
            "revenue"
        ).textContent =
            formatCurrency(data.revenue);


        document.getElementById(
            "orders"
        ).textContent =
            formatNumber(data.orders);


        document.getElementById(
            "events"
        ).textContent =
            formatNumber(data.events);


        document.getElementById(
            "uniqueUsers"
        ).textContent =
            formatNumber(data.unique_users);


        /*
         * Window timestamp
         */

        if (data.window_end) {

            document.getElementById(
                "lastUpdate"
            ).textContent =
                data.window_end;

        } else {

            document.getElementById(
                "lastUpdate"
            ).textContent =
                new Date().toLocaleTimeString(
                    "de-DE"
                );
        }


        clearError();

    } catch (error) {

        console.error(
            "Metrics error:",
            error
        );


        showError(
            "Metrics konnten nicht geladen werden: " +
            error.message
        );
    }
}


/* ============================================================
   HISTORY
   ============================================================ */

async function loadHistory() {

    try {

        const response = await fetch(
            "/api/history",
            {
                method: "GET",
                cache: "no-store"
            }
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }


        const history = await response.json();


        console.log(
            "History:",
            history
        );


        if (!Array.isArray(history)) {

            console.warn(
                "History API returned:",
                history
            );

            return;
        }


        updateCharts(history);

    } catch (error) {

        console.error(
            "History error:",
            error
        );
    }
}


/* ============================================================
   CREATE CHART LABEL
   ============================================================ */

function createLabel(item) {

    const value =
        item.window_start ||
        item.timestamp ||
        item.time ||
        "";


    if (!value) {
        return "";
    }


    /*
     * Convert Spark timestamp:
     *
     * 2026-08-29 15:21:00
     *
     * to JavaScript date format.
     */

    const date = new Date(
        value.replace(" ", "T")
    );


    if (isNaN(date.getTime())) {

        return value;
    }


    return date.toLocaleTimeString(
        "de-DE",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* ============================================================
   UPDATE CHARTS
   ============================================================ */

function updateCharts(history) {

    if (!history || history.length === 0) {

        console.log(
            "No history data available"
        );

        return;
    }


    /*
     * Newest data should be displayed
     * from left to right chronologically.
     */

    const data = [...history].reverse();


    const labels = data.map(
        item => createLabel(item)
    );


    const revenue = data.map(
        item => Number(item.revenue || 0)
    );


    const orders = data.map(
        item => Number(item.orders || 0)
    );


    const events = data.map(
        item => Number(item.events || 0)
    );


    /* ========================================================
       REVENUE CHART
       ======================================================== */

    const revenueCanvas =
        document.getElementById(
            "revenueChart"
        );


    if (revenueChart) {

        revenueChart.destroy();
    }


    revenueChart = new Chart(
        revenueCanvas,
        {
            type: "line",

            data: {

                labels: labels,

                datasets: [
                    {
                        label: "Revenue (€)",

                        data: revenue,

                        borderWidth: 2,

                        tension: 0.3,

                        fill: false
                    }
                ]
            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {
                    intersect: false,
                    mode: "index"
                },

                plugins: {

                    legend: {
                        display: true
                    }
                },

                scales: {

                    y: {
                        beginAtZero: false
                    }
                }
            }
        }
    );


    /* ========================================================
       ORDERS / EVENTS CHART
       ======================================================== */

    const ordersCanvas =
        document.getElementById(
            "ordersChart"
        );


    if (ordersChart) {

        ordersChart.destroy();
    }


    ordersChart = new Chart(
        ordersCanvas,
        {
            type: "line",

            data: {

                labels: labels,

                datasets: [

                    {
                        label: "Orders",

                        data: orders,

                        borderWidth: 2,

                        tension: 0.3,

                        fill: false
                    },

                    {
                        label: "Events",

                        data: events,

                        borderWidth: 2,

                        tension: 0.3,

                        fill: false
                    }

                ]
            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {
                    intersect: false,
                    mode: "index"
                },

                plugins: {

                    legend: {
                        display: true
                    }
                },

                scales: {

                    y: {
                        beginAtZero: true
                    }
                }
            }
        }
    );
}


/* ============================================================
   REFRESH
   ============================================================ */

async function refreshDashboard() {

    /*
     * Metrics are independent from history.
     * Even if history fails, KPIs still work.
     */

    await loadMetrics();

    await loadHistory();
}


/* ============================================================
   INITIAL LOAD
   ============================================================ */

console.log(
    "Realtime E-Commerce Dashboard started"
);


refreshDashboard();


/*
 * Update every 5 seconds.
 */

setInterval(
    refreshDashboard,
    5000
);

</script>

</body>
</html>
